<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>destro5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, rgba(15, 0, 5, 0.85) 0%, rgba(0, 0, 0, 0.95) 100%), url('img/photo_5186411960885513284_y.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(15, 5, 5, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(220, 20, 60, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0a0a0a;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ff1e3c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 0.9rem;
            color: #d1d1d1;
            margin-bottom: 1.5rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 30, 60, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #ff1e3c;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(90deg, #8b0015 0%, #d90429 100%);
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(217, 4, 41, 0.5);
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #888;
        }

        /* Estilos para el mensaje de éxito */
        #success-message {
            display: none; /* Oculto por defecto */
            margin-top: 1rem;
        }

        #success-message p {
            color: #ffffff; /* Ahora es blanco, igual que el resto del texto */
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="img/photo_5186411960885513284_y.png" alt="Portada del Álbum" class="cover-art">
    
    <h1>email</h1>
    <p></p>

    <form id="mi-formulario" action="https://formspree.io/f/xykonjge" method="POST">
        <input type="email" name="email" placeholder="email:email@hotmail.com" required>
        <button type="submit">subscribe</button>
    </form>

    <div id="success-message">
        <p>Thank you for your support, you'll hear from me soon...</p>
    </div>

    <div class="footer">
        Thanks...
    </div>
</div>

<script>
    var form = document.getElementById("mi-formulario");
    var successMessage = document.getElementById("success-message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault(); 
        
        var data = new FormData(form);
        
        try {
            const response = await fetch(form.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            if (response.ok) {
                form.style.display = "none";
                successMessage.style.display = "block";
                form.reset(); 
            } else {
                alert("Hubo un problema. Por favor intenta de nuevo.");
            }
        } catch (error) {
            alert("Error de conexión. Revisa tu internet.");
        }
    });
</script>

</body>
</html>
