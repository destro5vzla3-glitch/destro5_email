<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>destro5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo con tu imagen y un gradiente oscuro (Noir) encima para mantener legibilidad */
            background: linear-gradient(135deg, rgba(15, 0, 5, 0.85) 0%, rgba(0, 0, 0, 0.95) 100%), url('img/photo_5186411960885513284_y.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            /* Efecto cristal oscuro (Glassmorphism) para un look muy profesional */
            background: rgba(15, 5, 5, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(220, 20, 60, 0.2); /* Borde sutil crimson */
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0a0a0a;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ff1e3c; /* Crimson vibrante / Neón oscuro */
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 0.9rem;
            color: #d1d1d1;
            margin-bottom: 1.5rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 30, 60, 0.3);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #ff1e3c;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            /* Gradiente Crimson para el botón */
            background: linear-gradient(90deg, #8b0015 0%, #d90429 100%);
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(217, 4, 41, 0.5); /* Resplandor al pasar el mouse */
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tu imagen original -->
    <img src="img/photo_5186411960885513284_y.png" alt="Portada del Álbum" class="cover-art">
    
    <h1>email</h1>
    <p></p>

    <!-- Configuración de Formspree -->
    <form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
        <input type="email" name="email" placeholder="Tu correo electrónico" required>
        <button type="submit">SUSCRIBIRME</button>
    </form>

    <div class="footer">
        Thanks...
    </div>
</div>

</body>
</html>
